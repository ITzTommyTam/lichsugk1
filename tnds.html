<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Tập Lịch Sử - Chủ Đề ASEAN 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sakura-bg: #fff5f7;
      --sakura-card: #ffffff;
      --sakura-pink: #f7a8b8;
      --sakura-primary: #e65f78;
      --sakura-hover: #d24b64;
      --sakura-soft: #fde8ed;
      --sakura-accent: #fcd0da;
      --text-main: #4a343a;
      --text-muted: #82666e;
      --correct-bg: #e8f5e9;
      --correct-color: #2e7d32;
      --correct-border: #a5d6a7;
      --wrong-bg: #ffebee;
      --wrong-color: #c62828;
      --wrong-border: #ef9a9a;
      --shadow-soft: 0 8px 24px rgba(247, 168, 184, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #fff0f3 0%, #fff6f8 50%, #fbe7ee 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* Hiệu ứng cánh hoa anh đào bay */
    .sakura-petal {
      position: fixed;
      top: -20px;
      pointer-events: none;
      z-index: 9999;
      background: #ffb7c5;
      border-radius: 150% 0 150% 0;
      opacity: 0.65;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(540deg) translateX(80px);
      }
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 24px 20px;
      border-radius: 24px;
      border: 2px solid var(--sakura-accent);
      box-shadow: var(--shadow-soft);
    }

    header h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 26px;
      color: var(--sakura-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Bảng thông tin thanh trạng thái */
    .dashboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed var(--sakura-pink);
    }

    .stats {
      display: flex;
      gap: 16px;
      font-size: 14px;
      font-weight: 700;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 30px;
      background: var(--sakura-soft);
      color: var(--sakura-primary);
    }

    .btn-shuffle {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, var(--sakura-primary), var(--sakura-hover));
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(230, 95, 120, 0.3);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-shuffle:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(230, 95, 120, 0.4);
    }

    /* Khung câu hỏi */
    .question-card {
      background: var(--sakura-card);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1.5px solid rgba(247, 168, 184, 0.4);
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease;
    }

    .question-header {
      font-family: 'Quicksand', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--sakura-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .passage-box {
      background: var(--sakura-soft);
      padding: 16px 18px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.6;
      border-left: 4px solid var(--sakura-primary);
      margin-bottom: 18px;
      color: #3b282d;
    }

    /* Bảng dữ liệu nếu có */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      font-size: 14px;
    }

    .data-table th, .data-table td {
      border: 1px solid var(--sakura-accent);
      padding: 8px 12px;
      text-align: left;
    }

    .data-table th {
      background: #fcd0da;
      color: var(--text-main);
      font-weight: 700;
    }

    /* Danh sách phát biểu con */
    .sub-item {
      padding: 14px 16px;
      border-radius: 14px;
      background: #fff9fb;
      border: 1px solid #f9dbe3;
      margin-bottom: 12px;
      transition: all 0.25s ease;
    }

    .sub-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .statement-text {
      font-size: 15px;
      line-height: 1.5;
      flex: 1;
    }

    .statement-text b {
      color: var(--sakura-primary);
      margin-right: 4px;
    }

    .choice-buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-choice {
      border: 1.5px solid var(--sakura-pink);
      background: white;
      color: var(--text-main);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-choice:hover:not(:disabled) {
      background: var(--sakura-soft);
      border-color: var(--sakura-primary);
    }

    /* Trạng thái đúng/sai sau khi chọn */
    .sub-item.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
    }

    .sub-item.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
    }

    .btn-choice.selected-correct {
      background: var(--correct-color) !important;
      color: white !important;
      border-color: var(--correct-color) !important;
    }

    .btn-choice.selected-wrong {
      background: var(--wrong-color) !important;
      color: white !important;
      border-color: var(--wrong-color) !important;
    }

    .btn-choice:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    .explanation {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.45;
      display: none;
    }

    .sub-item.correct .explanation {
      display: block;
      background: rgba(46, 125, 50, 0.08);
      color: var(--correct-color);
      border-left: 3px solid var(--correct-color);
    }

    .sub-item.wrong .explanation {
      display: block;
      background: rgba(198, 40, 40, 0.08);
      color: var(--wrong-color);
      border-left: 3px solid var(--wrong-color);
    }

    @media (max-width: 600px) {
      .sub-item-header {
        flex-direction: column;
      }
      .choice-buttons {
        width: 100%;
        justify-content: flex-end;
        margin-top: 8px;
      }
      header h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

    // Thuật toán tráo ngẫu nhiên mảng (Fisher-Yates)
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    let userState = {
      answered: 0,
      correct: 0,
      wrong: 0,
      totalItems: 28
    };

    function updateStats() {
      document.getElementById('answeredCount').textContent = `Đã làm: ${userState.answered}/${userState.totalItems} ý`;
      document.getElementById('scoreCount').innerHTML = `Đúng: <span style="color:var(--correct-color)">${userState.correct}</span> | Sai: <span style="color:var(--wrong-color)">${userState.wrong}</span>`;
    }

    function checkAnswer(btn, userChoice, isCorrect, explainText, subItemId) {
      const container = document.getElementById(subItemId);
      const buttons = container.querySelectorAll('.btn-choice');
      
      // Khóa nút không cho chọn lại
      buttons.forEach(b => b.disabled = true);

      userState.answered++;

      if (userChoice === isCorrect) {
        userState.correct++;
        container.classList.add('correct');
        btn.classList.add('selected-correct');
      } else {
        userState.wrong++;
        container.classList.add('wrong');
        btn.classList.add('selected-wrong');
        
        // Highlight nút đúng cho người học dễ nhận biết
        buttons.forEach(b => {
          const isButtonTrue = (b.textContent.trim() === 'Đúng');
          if (isButtonTrue === isCorrect) {
            b.style.borderColor = 'var(--correct-color)';
            b.style.color = 'var(--correct-color)';
            b.style.fontWeight = '800';
          }
        });
      }

      updateStats();
    }

    function renderQuiz(questions) {
      const quizList = document.getElementById('quiz-list');
      quizList.innerHTML = '';

      questions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        // Shuffle các phát biểu a, b, c, d nếu muốn hoặc giữ nguyên nhãn a, b, c, d
        let subItemsHtml = '';
        q.items.forEach((item, itemIdx) => {
          const subId = `sub_${q.id}_${itemIdx}`;
          subItemsHtml += `
            <div class="sub-item" id="${subId}">
              <div class="sub-item-header">
                <div class="statement-text">
                  <b>${item.label})</b> ${item.text}
                </div>
                <div class="choice-buttons">
                  <button class="btn-choice" onclick="checkAnswer(this, true, ${item.answer}, '${item.explain.replace(/'/g, "\\'")}', '${subId}')">Đúng</button>
                  <button class="btn-choice" onclick="checkAnswer(this, false, ${item.answer}, '${item.explain.replace(/'/g, "\\'")}', '${subId}')">Sai</button>
                </div>
              </div>
              <div class="explanation">
                <strong>${item.answer ? '✔️ ĐÁP ÁN: ĐÚNG' : '❌ ĐÁP ÁN: SAI'}</strong> — ${item.explain}
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="question-header">
            <span>🌸 ${q.title}</span>
          </div>
          <div class="passage-box">
            ${q.passage}
          </div>
          <div class="sub-list">
            ${subItemsHtml}
          </div>
        `;

        quizList.appendChild(card);
      });
    }

    function initQuiz(isShuffle = false) {
      userState = {
        answered: 0,
        correct: 0,
        wrong: 0,
        totalItems: 28
      };
      updateStats();

      let questionsToRender = JSON.parse(JSON.stringify(rawQuestions));
      if (isShuffle) {
        questionsToRender = shuffleArray(questionsToRender);
        // Tráo luôn thứ tự các ý a, b, c, d trong câu hỏi
        questionsToRender.forEach(q => {
          q.items = shuffleArray(q.items);
        });
      }
      renderQuiz(questionsToRender);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Hiệu ứng cánh hoa anh đào rơi nhẹ
    function createSakuraPetals() {
      const container = document.getElementById('sakura-container');
      const petalCount = 18;

      for (let i = 0; i < petalCount; i++) {
        setTimeout(() => {
          const petal = document.createElement('div');
          petal.className = 'sakura-petal';
          petal.style.left = Math.random() * 100 + 'vw';
          petal.style.animationDuration = 7 + Math.random() * 8 + 's';
          petal.style.animationDelay = Math.random() * 5 + 's';
          
          const size = 10 + Math.random() * 12;
          petal.style.width = size + 'px';
          petal.style.height = (size * 1.3) + 'px';

          container.appendChild(petal);

          petal.addEventListener('animationend', () => {
            petal.remove();
            createSinglePetal();
          });
        }, i * 300);
      }
    }

    function createSinglePetal() {
      const container = document.getElementById('sakura-container');
      const petal = document.createElement('div');
      petal.className = 'sakura-petal';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = 7 + Math.random() * 8 + 's';
      
      const size = 10 + Math.random() * 12;
      petal.style.width = size + 'px';
      petal.style.height = (size * 1.3) + 'px';

      container.appendChild(petal);

      petal.addEventListener('animationend', () => {
        petal.remove();
        createSinglePetal();
      });
    }

    // Khởi chạy khi tải trang
    document.addEventListener('DOMContentLoaded', () => {
      initQuiz(false);
      createSakuraPetals();
    });
  </script>
